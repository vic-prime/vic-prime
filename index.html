<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VicPrime Market</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Poppins:wght@500;600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --black: #0A0E1A;
            --navy: #1A1F2E;
            --blue: #2563EB;
            --silver: #C0C0C0;
            --gray: #A0AEC0;
            --white: #FFFFFF;
            --green: #10B981;
            --red: #EF4444;
            --whatsapp: #25D366;
        }
        body { font-family: 'Inter', sans-serif; background: var(--black); color: var(--white); min-height: 100vh; }
        h1,h2,h3 { font-family: 'Poppins', sans-serif; }
        
        .header { background: rgba(10,14,26,0.95); padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid rgba(192,192,192,0.1); }
        .logo { font-size: 22px; font-weight: 800; cursor: pointer; }
        .logo span { color: var(--silver); }
        .nav-btns { display: flex; gap: 10px; }
        
        .btn { padding: 10px 20px; border-radius: 50px; border: none; cursor: pointer; font-weight: 600; font-size: 14px; transition: all 0.3s; }
        .btn-primary { background: var(--blue); color: white; }
        .btn-secondary { background: transparent; color: var(--silver); border: 2px solid rgba(192,192,192,0.3); }
        .btn-whatsapp { background: var(--whatsapp); color: white; }
        .btn-sm { padding: 6px 14px; font-size: 12px; }
        
        .container { max-width: 1200px; margin: 0 auto; padding: 20px; }
        .hero { text-align: center; padding: 60px 20px; }
        .hero h1 { font-size: 48px; margin-bottom: 16px; }
        .hero p { color: var(--gray); margin-bottom: 24px; font-size: 18px; }
        
        .section-title { font-size: 28px; margin-bottom: 20px; }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .card { background: var(--navy); border-radius: 16px; overflow: hidden; cursor: pointer; transition: all 0.3s; border: 1px solid rgba(192,192,192,0.1); }
        .card:hover { border-color: var(--blue); transform: translateY(-4px); }
        .card-img { height: 160px; background: #0F1525; display: flex; align-items: center; justify-content: center; font-size: 50px; }
        .card-body { padding: 16px; }
        .card-title { font-weight: 700; font-size: 16px; margin-bottom: 4px; }
        .card-desc { font-size: 13px; color: var(--gray); }
        .card-price { font-size: 20px; font-weight: 800; margin: 8px 0; }
        
        .product-actions { display: flex; gap: 6px; flex-wrap: wrap; }
        .product-actions .btn { flex: 1; min-width: 60px; text-align: center; font-size: 11px; padding: 8px 6px; }
        
        .page { display: none; }
        .page.active { display: block; }
        
        .form-input { width: 100%; padding: 12px; border-radius: 8px; border: 2px solid rgba(192,192,192,0.2); background: #0F1525; color: white; font-size: 14px; margin-bottom: 12px; }
        .form-input:focus { border-color: var(--blue); outline: none; }
        
        .toast { position: fixed; top: 80px; right: 20px; background: var(--navy); padding: 14px 20px; border-radius: 10px; z-index: 9999; animation: slideIn 0.3s; }
        @keyframes slideIn { from { transform: translateX(100%); } to { transform: translateX(0); } }
        
        .empty { text-align: center; padding: 40px; color: var(--gray); }
        .empty i { font-size: 50px; margin-bottom: 16px; }
        
        .loading { text-align: center; padding: 40px; color: var(--gray); }
        .spinner { width: 40px; height: 40px; border: 4px solid rgba(192,192,192,0.1); border-top-color: var(--blue); border-radius: 50%; animation: spin 1s linear infinite; margin: 0 auto 16px; }
        @keyframes spin { to { transform: rotate(360deg); } }
        
        @media (max-width: 600px) {
            .hero h1 { font-size: 32px; }
            .grid { grid-template-columns: 1fr; }
            .btn { padding: 8px 14px; font-size: 12px; }
        }
    </style>
</head>
<body>

<!-- Header -->
<header class="header">
    <div class="logo" onclick="showPage('home')">Vic<span>Prime</span></div>
    <div class="nav-btns">
        <button class="btn btn-secondary btn-sm" onclick="showPage('marketplace')"><i class="fas fa-store"></i> Browse</button>
        <button class="btn btn-primary btn-sm" onclick="showPage('products')"><i class="fas fa-box"></i> Products</button>
        <button class="btn btn-secondary btn-sm" onclick="showPage('cart')"><i class="fas fa-shopping-cart"></i> Cart <span id="cartCount" style="background:var(--blue);border-radius:50%;padding:2px 8px;">0</span></button>
        <button class="btn btn-primary btn-sm" onclick="showPage('login')"><i class="fas fa-user"></i></button>
    </div>
</header>

<!-- HOME -->
<div class="page active" id="page-home">
    <div class="hero">
        <h1>One Marketplace.<br><span style="color:var(--blue);">Every Business.</span></h1>
        <p>Discover businesses and shop products on VicPrime.</p>
        <button class="btn btn-primary" onclick="showPage('marketplace')">Browse Marketplace</button>
    </div>
    <div class="container">
        <h2 class="section-title">Categories</h2>
        <div class="grid" id="categoriesGrid"></div>
        <h2 class="section-title" style="margin-top:40px;">Featured Businesses</h2>
        <div class="grid" id="featuredBusinesses"></div>
    </div>
</div>

<!-- MARKETPLACE -->
<div class="page" id="page-marketplace">
    <div class="container">
        <h1 class="section-title">Discover Businesses</h1>
        <input type="text" class="form-input" id="businessSearch" placeholder="Search businesses..." onkeyup="searchBusinesses()">
        <div class="grid" id="allBusinesses"></div>
    </div>
</div>

<!-- PRODUCTS -->
<div class="page" id="page-products">
    <div class="container">
        <h1 class="section-title">Browse Products</h1>
        <input type="text" class="form-input" id="productSearch" placeholder="Search products..." onkeyup="searchProducts()">
        <div class="grid" id="allProducts"></div>
    </div>
</div>

<!-- PRODUCT DETAIL -->
<div class="page" id="page-productDetail">
    <div class="container" id="productDetailContent"></div>
</div>

<!-- BUSINESS DETAIL -->
<div class="page" id="page-businessDetail">
    <div class="container" id="businessDetailContent"></div>
</div>

<!-- CART -->
<div class="page" id="page-cart">
    <div class="container" id="cartContent"></div>
</div>

<!-- LOGIN -->
<div class="page" id="page-login">
    <div class="container" style="max-width:400px;padding-top:60px;">
        <h2 style="text-align:center;margin-bottom:20px;">Sign In</h2>
        <input type="email" class="form-input" id="loginEmail" placeholder="Email">
        <input type="password" class="form-input" id="loginPass" placeholder="Password">
        <button class="btn btn-primary" style="width:100%;" onclick="doLogin()">Sign In</button>
        <p style="text-align:center;margin-top:12px;color:var(--gray);">No account? <a href="#" onclick="showPage('register')" style="color:var(--blue);">Register</a></p>
    </div>
</div>

<!-- REGISTER -->
<div class="page" id="page-register">
    <div class="container" style="max-width:400px;padding-top:40px;">
        <h2 style="text-align:center;margin-bottom:20px;">Create Account</h2>
        <input type="text" class="form-input" id="regName" placeholder="Full Name">
        <input type="email" class="form-input" id="regEmail" placeholder="Email">
        <input type="password" class="form-input" id="regPass" placeholder="Password">
        <button class="btn btn-primary" style="width:100%;" onclick="doRegister()">Create Account</button>
    </div>
</div>

<script>
// API Configuration
const API_URL = 'https://backend-4-io0g.onrender.com/api';

// Simple data store
let cart = JSON.parse(localStorage.getItem('vic_cart') || '[]');
let currentUser = JSON.parse(localStorage.getItem('vic_user') || 'null');

const categories = [
    { name: 'Electronics', icon: '📱' },
    { name: 'Fashion', icon: '👗' },
    { name: 'Food & Beverage', icon: '🍽️' },
    { name: 'Services', icon: '💼' },
    { name: 'Home & Garden', icon: '🏠' },
    { name: 'Beauty & Health', icon: '💄' },
    { name: 'Automotive', icon: '🚗' },
    { name: 'Education', icon: '📚' }
];

// API Call
async function api(url) {
    try {
        const res = await fetch(API_URL + url);
        return await res.json();
    } catch(e) {
        return { success: false, message: 'Cannot connect to server' };
    }
}

// Show page
function showPage(page) {
    document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
    document.getElementById('page-' + page).classList.add('active');
    window.scrollTo(0, 0);
    
    if (page === 'home') loadHome();
    if (page === 'marketplace') loadBusinesses();
    if (page === 'products') loadProducts();
    if (page === 'cart') renderCart();
}

// Toast
function toast(msg, type = 'success') {
    const t = document.createElement('div');
    t.className = 'toast';
    t.textContent = msg;
    t.style.borderLeft = `4px solid ${type === 'success' ? '#10B981' : '#EF4444'}`;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 3000);
}

// Load Home
async function loadHome() {
    // Categories
    document.getElementById('categoriesGrid').innerHTML = categories.map(c => `
        <div class="card" onclick="filterCategory('${c.name}')">
            <div class="card-img">${c.icon}</div>
            <div class="card-body"><div class="card-title">${c.name}</div></div>
        </div>`).join('');
    
    // Featured Businesses
    const fb = document.getElementById('featuredBusinesses');
    fb.innerHTML = '<div class="loading"><div class="spinner"></div>Loading...</div>';
    const result = await api('/businesses?limit=3');
    if (result.success && result.businesses) {
        fb.innerHTML = result.businesses.map(b => `
            <div class="card" onclick="showBusinessDetail('${b._id}')">
                <div class="card-img">🏪</div>
                <div class="card-body">
                    <div class="card-title">${b.name}</div>
                    <div class="card-desc">${b.category}</div>
                    <div class="card-desc">📍 ${b.location}</div>
                </div>
            </div>`).join('');
    } else {
        fb.innerHTML = '<div class="empty"><i class="fas fa-store"></i><p>No businesses yet</p></div>';
    }
}

// Load Businesses
async function loadBusinesses() {
    const grid = document.getElementById('allBusinesses');
    grid.innerHTML = '<div class="loading"><div class="spinner"></div>Loading...</div>';
    const result = await api('/businesses?limit=50');
    if (result.success && result.businesses) {
        grid.innerHTML = result.businesses.map(b => `
            <div class="card" onclick="showBusinessDetail('${b._id}')">
                <div class="card-img">🏪</div>
                <div class="card-body">
                    <div class="card-title">${b.name}</div>
                    <div class="card-desc">${b.category}</div>
                    <div class="card-desc">📍 ${b.location}</div>
                    <button class="btn btn-primary btn-sm" style="margin-top:8px;">View Store</button>
                </div>
            </div>`).join('');
    } else {
        grid.innerHTML = '<div class="empty"><i class="fas fa-store"></i><p>No businesses found</p></div>';
    }
}

// Search Businesses
function searchBusinesses() {
    const q = document.getElementById('businessSearch').value;
    loadBusinesses(q);
}

// Load Products
async function loadProducts() {
    const grid = document.getElementById('allProducts');
    grid.innerHTML = '<div class="loading"><div class="spinner"></div>Loading...</div>';
    const result = await api('/products?limit=50');
    if (result.success && result.products) {
        grid.innerHTML = result.products.map(p => `
            <div class="card">
                <div class="card-img">📦</div>
                <div class="card-body">
                    <div class="card-title">${p.name}</div>
                    <div class="card-desc">${p.business?.name || 'Seller'}</div>
                    <div class="card-price">$${p.price}</div>
                    <div class="product-actions">
                        <button class="btn btn-primary" onclick="addToCart('${p._id}','${p.name}',${p.price},'${p.business?.name || ''}')">Add to Cart</button>
                        <button class="btn btn-secondary" onclick="showProductDetail('${p._id}')">View</button>
                    </div>
                </div>
            </div>`).join('');
    } else {
        grid.innerHTML = '<div class="empty"><i class="fas fa-box"></i><p>No products found</p></div>';
    }
}

// Search Products
function searchProducts() {
    loadProducts();
}

// Filter by Category
function filterCategory(cat) {
    showPage('products');
    // Filter products by category
}

// Show Product Detail
async function showProductDetail(id) {
    const container = document.getElementById('productDetailContent');
    container.innerHTML = '<div class="loading"><div class="spinner"></div>Loading...</div>';
    showPage('productDetail');
    const result = await api('/products/' + id);
    if (result.success && result.product) {
        const p = result.product;
        container.innerHTML = `
            <button class="btn btn-secondary btn-sm" onclick="showPage('products')">← Back</button>
            <div class="card" style="padding:20px;margin-top:16px;">
                <div class="card-img" style="height:250px;">📦</div>
                <div class="card-body">
                    <h2>${p.name}</h2>
                    <div class="card-price" style="font-size:28px;">$${p.price}</div>
                    <p>${p.description}</p>
                    <p style="color:var(--gray);">Seller: ${p.business?.name || 'Unknown'}</p>
                    <div style="display:flex;gap:10px;margin-top:16px;">
                        <button class="btn btn-primary" onclick="addToCart('${p._id}','${p.name}',${p.price},'${p.business?.name || ''}')">Add to Cart</button>
                        <a href="https://wa.me/${p.business?.whatsapp || ''}" target="_blank" class="btn btn-whatsapp">WhatsApp</a>
                    </div>
                </div>
            </div>`;
    }
}

// Show Business Detail
async function showBusinessDetail(id) {
    const container = document.getElementById('businessDetailContent');
    container.innerHTML = '<div class="loading"><div class="spinner"></div>Loading...</div>';
    showPage('businessDetail');
    const result = await api('/businesses/' + id);
    if (result.success && result.business) {
        const b = result.business;
        container.innerHTML = `
            <button class="btn btn-secondary btn-sm" onclick="showPage('marketplace')">← Back</button>
            <div class="card" style="padding:20px;margin-top:16px;">
                <div class="card-img" style="height:150px;">🏪</div>
                <div class="card-body">
                    <h2>${b.name}</h2>
                    <p style="color:var(--blue);">${b.category}</p>
                    <p>${b.description}</p>
                    <p>📍 ${b.location}</p>
                    <a href="https://wa.me/${b.whatsapp || ''}" target="_blank" class="btn btn-whatsapp btn-sm">WhatsApp</a>
                </div>
            </div>`;
    }
}

// Cart Functions
function addToCart(id, name, price, businessName) {
    const existing = cart.find(c => c.id === id);
    if (existing) existing.qty++;
    else cart.push({ id, name, price, businessName, qty: 1 });
    localStorage.setItem('vic_cart', JSON.stringify(cart));
    updateCartCount();
    toast(`${name} added to cart!`);
}

function updateCartCount() {
    document.getElementById('cartCount').textContent = cart.reduce((s, i) => s + i.qty, 0);
}

function renderCart() {
    const c = document.getElementById('cartContent');
    if (!cart.length) {
        c.innerHTML = '<div class="empty"><i class="fas fa-shopping-cart"></i><p>Your cart is empty</p></div>';
        return;
    }
    const total = cart.reduce((s, i) => s + i.price * i.qty, 0);
    c.innerHTML = `
        <h1 class="section-title">Shopping Cart</h1>
        ${cart.map((item, i) => `
            <div class="card" style="padding:16px;margin-bottom:10px;display:flex;justify-content:space-between;">
                <div>
                    <strong>${item.name}</strong><br>
                    <span style="font-size:12px;color:var(--gray);">${item.businessName}</span><br>
                    <strong>$${(item.price * item.qty).toFixed(2)}</strong>
                </div>
                <div style="display:flex;gap:8px;align-items:center;">
                    <button class="btn btn-secondary btn-sm" onclick="updateQty(${i}, -1)">−</button>
                    <span>${item.qty}</span>
                    <button class="btn btn-secondary btn-sm" onclick="updateQty(${i}, 1)">+</button>
                    <button class="btn btn-sm" style="background:#EF4444;color:white;" onclick="removeItem(${i})">🗑</button>
                </div>
            </div>`).join('')}
        <div class="card" style="padding:20px;display:flex;justify-content:space-between;">
            <strong>Total: $${total.toFixed(2)}</strong>
            <button class="btn btn-primary" onclick="checkout()">Checkout</button>
        </div>`;
}

function updateQty(index, delta) {
    cart[index].qty += delta;
    if (cart[index].qty <= 0) cart.splice(index, 1);
    localStorage.setItem('vic_cart', JSON.stringify(cart));
    updateCartCount();
    renderCart();
}

function removeItem(index) {
    cart.splice(index, 1);
    localStorage.setItem('vic_cart', JSON.stringify(cart));
    updateCartCount();
    renderCart();
}

function checkout() {
    toast('Order placed! Contact seller via WhatsApp.');
    cart = [];
    localStorage.setItem('vic_cart', JSON.stringify(cart));
    updateCartCount();
    renderCart();
}

// Auth
function doLogin() {
    const email = document.getElementById('loginEmail').value;
    if (!email) { toast('Enter email', 'error'); return; }
    currentUser = { name: email.split('@')[0], email };
    localStorage.setItem('vic_user', JSON.stringify(currentUser));
    toast('Logged in!');
    showPage('home');
}

function doRegister() {
    const name = document.getElementById('regName').value;
    const email = document.getElementById('regEmail').value;
    if (!name || !email) { toast('Fill all fields', 'error'); return; }
    currentUser = { name, email };
    localStorage.setItem('vic_user', JSON.stringify(currentUser));
    toast('Account created!');
    showPage('home');
}

// Init
updateCartCount();
loadHome();
</script>
</body>
</html>
