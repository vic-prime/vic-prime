<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.5" />
  <title>VicMarket · share & earn</title>
  <!-- Font & icons (fast CDN) -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
  <style>
    /* reset & base – fast loading */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
    }
    body {
      background: #f5f7fb;
      color: #1e293b;
      padding: 16px 12px 80px;
      max-width: 600px;
      margin: 0 auto;
    }
    /* smooth loading */
    img {
      display: block;
      max-width: 100%;
      height: auto;
      background: #e9edf2;
      border-radius: 16px;
      object-fit: cover;
    }
    .card {
      background: white;
      border-radius: 24px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.04);
      padding: 16px 16px 12px;
      margin-bottom: 24px;
      transition: box-shadow 0.2s;
    }
    /* header */
    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .logo {
      font-weight: 700;
      font-size: 1.6rem;
      letter-spacing: -0.5px;
      background: linear-gradient(145deg, #0b2b5c, #1b4a8b);
      -webkit-background-clip: text;
      background-clip: text;
      color: transparent;
    }
    .viccoins-badge {
      background: #facc15;
      padding: 8px 16px;
      border-radius: 40px;
      font-weight: 600;
      font-size: 0.95rem;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 2px 8px rgba(250,204,21,0.3);
    }
    .viccoins-badge i {
      color: #92400e;
    }
    .add-coins-btn {
      background: #1e293b;
      border: none;
      color: white;
      font-weight: 600;
      padding: 6px 14px;
      border-radius: 40px;
      font-size: 0.8rem;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      transition: all 0.15s;
      margin-left: 8px;
    }
    .add-coins-btn:hover {
      background: #0f172a;
      transform: scale(0.96);
    }
    /* product card */
    .product-img {
      width: 100%;
      aspect-ratio: 1/1;
      border-radius: 20px;
      background: #dce1e9;
      margin-bottom: 12px;
      transition: opacity 0.2s;
    }
    .product-title {
      font-size: 1.3rem;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .product-shop {
      color: #475569;
      font-size: 0.9rem;
      margin-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .product-shop i {
      color: #3b82f6;
    }
    /* action row: share & earn + chat */
    .action-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 10px;
      margin: 12px 0 14px;
      border-top: 1px solid #eef2f6;
      padding-top: 14px;
    }
    .share-earn-btn {
      background: #0b2b5c;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 60px;
      font-weight: 600;
      font-size: 0.95rem;
      display: inline-flex;
      align-items: center;
      gap: 10px;
      box-shadow: 0 4px 12px rgba(11,43,92,0.25);
      cursor: pointer;
      transition: 0.15s;
      flex: 1 1 auto;
    }
    .share-earn-btn i {
      font-size: 1.1rem;
    }
    .share-earn-btn:active {
      transform: scale(0.94);
    }
    .chat-btn {
      background: #eef2f6;
      border: none;
      padding: 10px 16px;
      border-radius: 60px;
      font-weight: 600;
      color: #1e293b;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      transition: 0.15s;
      flex: 1 1 auto;
    }
    .chat-btn i {
      color: #2563eb;
    }
    .chat-btn:active {
      background: #dce1e9;
    }
    /* like & comment section */
    .interaction-bar {
      display: flex;
      align-items: center;
      gap: 24px;
      padding: 6px 0 4px;
      border-top: 1px solid #eef2f6;
      margin-top: 8px;
      padding-top: 12px;
    }
    .like-area {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 1.2rem;
      font-weight: 500;
    }
    .like-area i {
      font-size: 1.7rem;
      cursor: pointer;
      transition: 0.1s;
      color: #94a3b8;
    }
    .like-area i.liked {
      color: #ef4444;
    }
    .like-area i:active {
      transform: scale(1.3);
    }
    .comment-area {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .comment-input-wrap {
      display: flex;
      align-items: center;
      background: #f1f5f9;
      border-radius: 60px;
      padding: 4px 8px 4px 16px;
      transition: 0.15s;
    }
    .comment-input-wrap:focus-within {
      background: #e9edf2;
      box-shadow: 0 0 0 2px #3b82f6;
    }
    .comment-input-wrap input {
      border: none;
      background: transparent;
      padding: 10px 0;
      flex: 1;
      font-size: 0.95rem;
      outline: none;
      min-width: 60px;
    }
    .comment-input-wrap button {
      background: #2563eb;
      border: none;
      color: white;
      font-weight: 600;
      padding: 6px 16px;
      border-radius: 40px;
      font-size: 0.85rem;
      cursor: pointer;
      transition: 0.12s;
      white-space: nowrap;
    }
    .comment-input-wrap button:active {
      transform: scale(0.92);
    }
    /* comment list */
    .comment-list {
      margin-top: 10px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      max-height: 180px;
      overflow-y: auto;
      padding-right: 4px;
    }
    .comment-item {
      background: #f8fafc;
      border-radius: 20px;
      padding: 10px 16px;
      font-size: 0.9rem;
      display: flex;
      flex-direction: column;
      animation: fadeIn 0.2s ease;
    }
    .comment-user {
      font-weight: 700;
      color: #0b2b5c;
      font-size: 0.8rem;
      letter-spacing: 0.3px;
      margin-bottom: 2px;
    }
    .comment-text {
      word-break: break-word;
      line-height: 1.4;
    }
    .comment-time {
      font-size: 0.65rem;
      color: #94a3b8;
      align-self: flex-end;
      margin-top: 2px;
    }
    @keyframes fadeIn {
      from { opacity: 0.4; transform: translateY(6px); }
      to { opacity: 1; transform: translateY(0); }
    }
    /* chat inbox placeholder (just for demo) */
    .inbox-banner {
      background: #dbeafe;
      border-radius: 60px;
      padding: 12px 18px;
      text-align: center;
      font-weight: 500;
      color: #1e3a8a;
      margin: 12px 0 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
    }
    .inbox-banner i {
      font-size: 1.2rem;
    }
    /* hidden state for share button */
    .hidden-share {
      display: none !important;
    }
    /* responsive */
    @media (max-width: 480px) {
      .action-row { flex-direction: column; }
      .share-earn-btn, .chat-btn { width: 100%; justify-content: center; }
    }
    /* scroll */
    ::-webkit-scrollbar { width: 4px; }
    ::-webkit-scrollbar-track { background: #e2e8f0; border-radius: 12px; }
    ::-webkit-scrollbar-thumb { background: #94a3b8; border-radius: 12px; }
  </style>
</head>
<body>
  <!-- HEADER with VICCOINS + ADD MORE -->
  <div class="header">
    <span class="logo"><i class="fas fa-store-alt" style="color: #1e3a8a; margin-right: 4px;"></i>VicMarket</span>
    <div class="viccoins-badge">
      <i class="fas fa-coins"></i> <span id="viccoinsDisplay">48</span>
      <button class="add-coins-btn" id="addCoinsBtn"><i class="fas fa-plus-circle"></i> Add</button>
    </div>
  </div>

  <!-- MAIN PRODUCT CARD -->
  <div class="card" id="productCard">
    <!-- product image (fast loading with inline placeholder) -->
    <img class="product-img" src="https://images.unsplash.com/photo-1600185365483-26d7a4cc7519?w=600&h=600&fit=crop&crop=center&q=80&auto=format" alt="sneakers" loading="lazy" />
    
    <div class="product-title">Air Max Pulse</div>
    <div class="product-shop">
      <i class="fas fa-store"></i> Shop: <strong>Vic's Kicks</strong> 
      <span style="margin-left: auto; background: #eef2f6; padding: 2px 12px; border-radius: 30px; font-size: 0.75rem;">⭐ 4.8</span>
    </div>

    <!-- ACTION ROW: share & earn (conditional) + chat (replaces whatsapp) -->
    <div class="action-row">
      <!-- share & earn button – hidden by default, shown only when viccoins > 0 -->
      <button class="share-earn-btn" id="shareEarnBtn">
        <i class="fas fa-share-alt"></i> Share & Earn
      </button>
      <!-- chat with shop owner -> leads to inbox (simulated) -->
      <button class="chat-btn" id="chatBtn">
        <i class="fas fa-comment-dots"></i> Chat with Shop
      </button>
    </div>

    <!-- LIKE & COMMENT (increased size / pace) -->
    <div class="interaction-bar">
      <div class="like-area">
        <i class="fas fa-heart" id="likeIcon"></i>
        <span id="likeCount">142</span>
      </div>
      <div class="comment-area">
        <div class="comment-input-wrap">
          <input type="text" id="commentInput" placeholder="Write a comment…" />
          <button id="postCommentBtn"><i class="fas fa-paper-plane"></i> Post</button>
        </div>
        <!-- comment list with username (no name prompt) -->
        <div class="comment-list" id="commentList">
          <div class="comment-item"><span class="comment-user">@alex_vic</span><span class="comment-text">🔥 clean pair!</span><span class="comment-time">2m</span></div>
          <div class="comment-item"><span class="comment-user">@miamistyle</span><span class="comment-text">I need these in my collection</span><span class="comment-time">15m</span></div>
          <div class="comment-item"><span class="comment-user">@sneakerhead99</span><span class="comment-text">how's the comfort?</span><span class="comment-time">1h</span></div>
        </div>
      </div>
    </div>
  </div>

  <!-- CHAT INBOX preview (replaces whatsapp) -->
  <div class="inbox-banner" id="inboxBanner">
    <i class="fas fa-inbox"></i> Inbox · Chat with Vic's Kicks
  </div>

  <p style="text-align: center; color: #64748b; font-size: 0.8rem; margin-top: 12px;">
    <i class="fas fa-bolt" style="color: #eab308;"></i> fast loading · share & earn
  </p>

  <script>
    (function() {
      "use strict";

      // ---------- STATE ----------
      let viccoins = 48;                 // shop owner coins
      let likes = 142;
      let isLiked = false;
      let comments = [
        { user: '@alex_vic', text: '🔥 clean pair!', time: '2m' },
        { user: '@miamistyle', text: 'I need these in my collection', time: '15m' },
        { user: '@sneakerhead99', text: 'how\'s the comfort?', time: '1h' }
      ];

      // DOM refs
      const viccoinsSpan = document.getElementById('viccoinsDisplay');
      const shareBtn = document.getElementById('shareEarnBtn');
      const likeIcon = document.getElementById('likeIcon');
      const likeCountSpan = document.getElementById('likeCount');
      const commentInput = document.getElementById('commentInput');
      const postBtn = document.getElementById('postCommentBtn');
      const commentList = document.getElementById('commentList');
      const addCoinsBtn = document.getElementById('addCoinsBtn');
      const chatBtn = document.getElementById('chatBtn');
      const inboxBanner = document.getElementById('inboxBanner');

      // ---------- RENDER SHARE BUTTON (based on coins) ----------
      function updateShareButton() {
        if (viccoins > 0) {
          shareBtn.classList.remove('hidden-share');
        } else {
          shareBtn.classList.add('hidden-share');
        }
        viccoinsSpan.textContent = viccoins;
      }

      // ---------- RENDER COMMENTS ----------
      function renderComments() {
        commentList.innerHTML = '';
        comments.forEach(c => {
          const item = document.createElement('div');
          item.className = 'comment-item';
          item.innerHTML = `
            <span class="comment-user">${c.user}</span>
            <span class="comment-text">${c.text}</span>
            <span class="comment-time">${c.time}</span>
          `;
          commentList.appendChild(item);
        });
        // auto scroll to latest
        commentList.scrollTop = commentList.scrollHeight;
      }

      // ---------- ADD COMMENT (no name prompt, uses predefined user) ----------
      function addComment(text) {
        if (!text.trim()) return;
        // username fixed: "vic_community" + random suffix for demo
        const user = '@vic_community' + Math.floor(Math.random() * 100);
        const now = new Date();
        const timeStr = now.getHours() + ':' + String(now.getMinutes()).padStart(2, '0');
        comments.push({ user, text: text.trim(), time: timeStr });
        renderComments();
        commentInput.value = '';
      }

      // ---------- LIKE toggling (bigger size + pace) ----------
      function toggleLike() {
        isLiked = !isLiked;
        likes = isLiked ? likes + 1 : likes - 1;
        likeCountSpan.textContent = likes;
        likeIcon.classList.toggle('liked', isLiked);
        // haptic-like feedback
        likeIcon.style.transform = 'scale(1.5)';
        setTimeout(() => { likeIcon.style.transform = 'scale(1)'; }, 180);
      }

      // ---------- SHARE & EARN action (only when coins > 0) ----------
      function shareAndEarn() {
        if (viccoins <= 0) {
          alert('⚠️ You need VicCoins to share & earn! Add coins first.');
          return;
        }
        // simulate share & earn: +3 coins
        viccoins += 3;
        viccoinsSpan.textContent = viccoins;
        updateShareButton();
        alert('🎉 Shared! You earned +3 VicCoins! (total: ' + viccoins + ')');
        // bonus: like pace increase (just for demo)
        likes += 2;
        likeCountSpan.textContent = likes;
      }

      // ---------- ADD COINS (purchase) ----------
      function addCoins() {
        // simulate purchase: +20 coins
        viccoins += 20;
        viccoinsSpan.textContent = viccoins;
        updateShareButton();
        alert('✅ +20 VicCoins added! (total: ' + viccoins + ')');
      }

      // ---------- CHAT -> opens inbox (simulated) ----------
      function openChatInbox() {
        inboxBanner.style.background = '#bfdbfe';
        inboxBanner.innerHTML = `<i class="fas fa-comment-dots"></i> Inbox · chatting with Vic's Kicks (opened)`;
        inboxBanner.style.transition = '0.2s';
        setTimeout(() => {
          inboxBanner.style.background = '#dbeafe';
          inboxBanner.innerHTML = `<i class="fas fa-inbox"></i> Inbox · Chat with Vic's Kicks`;
        }, 2000);
        // actual navigation would be: window.location.href = '/inbox';
        alert('📩 Redirect to Chat Inbox (simulated)');
      }

      // ---------- INIT ----------
      function init() {
        // set initial like state
        likeIcon.classList.remove('liked');
        likeCountSpan.textContent = likes;
        updateShareButton();
        renderComments();

        // event listeners
        likeIcon.addEventListener('click', toggleLike);

        postBtn.addEventListener('click', function(e) {
          e.preventDefault();
          addComment(commentInput.value);
        });

        commentInput.addEventListener('keypress', function(e) {
          if (e.key === 'Enter') {
            e.preventDefault();
            addComment(commentInput.value);
          }
        });

        shareBtn.addEventListener('click', shareAndEarn);

        addCoinsBtn.addEventListener('click', addCoins);

        chatBtn.addEventListener('click', openChatInbox);

        // extra: if user clicks on inbox banner (simulate)
        inboxBanner.addEventListener('click', openChatInbox);
      }

      // start
      init();
    })();
  </script>
</body>
</html>
